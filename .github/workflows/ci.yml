name: "CI - Minimal Hello"

on:
  workflow_dispatch:
  push:
    branches:
      - ci/**
  pull_request:
    branches:
      - main

jobs:
  hello:
    name: "Sanity Hello"
    runs-on: ubuntu-latest
    steps:
      - name: Hello
        run: echo "hello from minimal ci.yml"

  preflight:
    name: "Preflight - Sanity & Artifacts"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate run_info
        run: |
          mkdir -p preflight
          echo "run_id=${{ github.run_id }}" > preflight/run_info.txt
          echo "sha=${{ github.sha }}" >> preflight/run_info.txt
          echo "ref=${{ github.ref }}" >> preflight/run_info.txt
          echo "event=${{ github.event_name }}" >> preflight/run_info.txt
          echo "runner_os=${{ runner.os }}" >> preflight/run_info.txt
          echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> preflight/run_info.txt

      - name: Upload Preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ github.run_id }}
          path: preflight/run_info.txt
          if-no-files-found: error

  tests:
    name: "Python Tests (code/)"
    runs-on: ubuntu-latest
    # 在 workflow_dispatch、ci/** 分支 push 和 PR 到 main 时运行
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/ci/') || github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          if [ -f code/requirements.txt ]; then pip install -r code/requirements.txt; fi
          # 确保测试与覆盖率插件可用
          pip install pytest pytest-cov

      - name: Run pytest in code/
        working-directory: code
        run: |
          mkdir -p reports/testing
          pytest -q --disable-warnings --maxfail=1 \
            --junitxml=reports/testing/junit.xml \
            --cov=. --cov-report=xml:reports/testing/coverage.xml \
            --cov-fail-under=85

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-code-${{ github.run_id }}
          path: |
            code/reports/testing/junit.xml
            code/reports/testing/coverage.xml
          if-no-files-found: warn

  contract:
    name: "Contract Tests (OpenAPI · Schemathesis · Dredd)"
    runs-on: ubuntu-latest
    needs: [tests]
    # 首轮以观察为主，暂不阻断 PR；待基线稳定后可去掉 continue-on-error
    continue-on-error: true
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (for Dredd)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r code/requirements.txt

      - name: Install Dredd (npm)
        working-directory: code
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund --save-dev dredd@^14.1.0

      - name: Launch API server (uvicorn)
        working-directory: code
        run: |
          nohup python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 --log-level warning &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null 2>&1; then echo "API ready"; break; fi
            sleep 1
          done

      - name: Fetch OpenAPI schema
        working-directory: code
        run: |
          mkdir -p reports/testing/openapi
          curl -fsS http://127.0.0.1:8000/openapi.json -o openapi_dump.json
          cp openapi_dump.json reports/testing/openapi/latest.json

      - name: Check operationId uniqueness
        working-directory: code
        run: |
          python tools/opid_check.py --input openapi_dump.json --fail-on-duplicates

      - name: Run Schemathesis
        working-directory: code
        run: |
          mkdir -p reports/testing/schemathesis
          schemathesis run http://127.0.0.1:8000/openapi.json \
            --base-url=http://127.0.0.1:8000 \
            --junit-xml=reports/testing/schemathesis/junit.xml \
            --checks=all || true

      - name: Run Dredd
        working-directory: code
        run: |
          mkdir -p reports/testing/dredd
          npx -y dredd http://127.0.0.1:8000/openapi.json http://127.0.0.1:8000 \
            --reporter junit --output reports/testing/dredd/junit.xml || true

      - name: Upload contract artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: contract-reports-${{ github.run_id }}
          path: |
            code/reports/testing/openapi/latest.json
            code/reports/testing/schemathesis/junit.xml
            code/reports/testing/dredd/junit.xml
          if-no-files-found: warn