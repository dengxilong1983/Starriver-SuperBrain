name: Preflight - Minimal Sanity

on:
  workflow_dispatch:
  push:
    branches:
      - ci/**

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Produce artifact file
        run: |
          mkdir -p preflight
          echo "run_id=${{ github.run_id }}" > preflight/run_info.txt
          echo "sha=${{ github.sha }}" >> preflight/run_info.txt
          echo "ref=${{ github.ref }}" >> preflight/run_info.txt
          echo "event=${{ github.event_name }}" >> preflight/run_info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ github.run_id }}
          path: preflight/run_info.txt
          if-no-files-found: error